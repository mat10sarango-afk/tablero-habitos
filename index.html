<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero de Hábitos</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Estilos propios -->
  <link href="css/estilos.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-5" style="max-width: 640px">
    <header class="text-center mb-4">
      <h1 class="fw-bold">📋 Tablero de Hábitos</h1>
      <p class="text-muted">Agrega tus hábitos diarios y márcalos al completarlos.</p>
    </header>

    <!-- Formulario para agregar hábitos -->
    <form id="form-habito" class="d-flex gap-2 mb-4">
      <input
        type="text"
        id="input-habito"
        class="form-control"
        placeholder="Ej: Beber 2L de agua"
        autocomplete="off"
        required
      />
      <button type="submit" class="btn btn-primary">Agregar</button>
    </form>

    <!-- Resumen -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span id="contador-habitos" class="text-muted small">0 hábitos</span>
      <button id="btn-limpiar" class="btn btn-sm btn-outline-danger">
        Eliminar completados
      </button>
    </div>

    <!-- Lista de hábitos (se llena dinámicamente con JS) -->
    <ul id="lista-habitos" class="list-group"></ul>

    <!-- Mensaje cuando no hay hábitos -->
    <p id="mensaje-vacio" class="text-center text-muted mt-4 d-none">
      Aún no tienes hábitos. ¡Agrega el primero! 🌱
    </p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
